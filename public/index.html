<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173f35">
    <title>Registro de pedidos | Coquito Amarillo</title>
    <link rel="stylesheet" href="/estilos.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="layout">
      <section class="intro" aria-labelledby="titulo">
        <p class="eyebrow">COQUITO AMARILLO S.A.S.</p>
        <h1 id="titulo">Registro de pedidos</h1>
        <p class="intro-copy">Un registro claro para que cada pedido llegue a su destino.</p>
        <div class="nota-operativa">
          <span class="indicador" aria-hidden="true"></span>
          <p>Los pedidos se guardan en el archivo de respaldo y en la base de datos.</p>
        </div>
      </section>

      <section class="formulario-panel" aria-label="Datos del pedido">
        <form id="formPedido">
          <div class="campo">
            <label for="nombreCliente">Nombre del cliente</label>
            <input type="text" id="nombreCliente" name="nombreCliente" maxlength="100" autocomplete="name" required>
          </div>
          <div class="campo">
            <label for="producto">Producto</label>
            <input type="text" id="producto" name="producto" maxlength="100" required>
          </div>
          <div class="fila-campos">
            <div class="campo">
              <label for="cantidad">Cantidad</label>
              <input type="number" id="cantidad" name="cantidad" min="1" step="1" inputmode="numeric" required>
            </div>
            <div class="campo">
              <label for="correo">Correo electrónico</label>
              <input type="email" id="correo" name="correo" maxlength="150" autocomplete="email" required>
            </div>
          </div>
          <button type="submit" id="botonEnviar">Registrar pedido <span aria-hidden="true">→</span></button>
          <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        </form>
        <p class="pie-formulario">Los campos marcados son necesarios para registrar el pedido.</p>
      </section>
    </main>
  </body>
</html>
